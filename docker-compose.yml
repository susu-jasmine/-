version: '3.8'

services:
  app:
    build: .
    container_name: asset-monitor
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
    environment:
      - WEB_WORKERS=1
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-random-hex-string}
      - JWT_EXPIRATION_HOURS=168
      - LOGIN_MAX_ATTEMPTS=5
      - LOGIN_LOCKOUT_MINUTES=15
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: Nginx reverse proxy (uncomment to enable)
